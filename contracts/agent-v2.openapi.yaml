  "components": {
    "schemas": {
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      },
      "Proposal": {
        "properties": {
          "grant_id": {
            "type": "string",
            "maxLength": 36,
            "minLength": 1,
            "title": "Grant Id"
          },
          "trip_id": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 36
              },
              {
                "type": "null"
              }
            ],
            "title": "Trip Id"
          },
          "expected_trip_version": {
            "type": "integer",
            "minimum": 0.0,
            "title": "Expected Trip Version"
          },
          "expected_plan_revision": {
            "type": "integer",
            "minimum": 0.0,
            "title": "Expected Plan Revision"
          },
          "summary": {
            "type": "string",
            "maxLength": 500,
            "minLength": 1,
            "title": "Summary"
          },
          "operations": {
            "items": {
              "oneOf": [
                {
                  "$ref": "#/components/schemas/CreateTrip"
                },
                {
                  "$ref": "#/components/schemas/UpdateTrip"
                },
                {
                  "$ref": "#/components/schemas/AddStop"
                },
                {
                  "$ref": "#/components/schemas/MoveStop"
                },
                {
                  "$ref": "#/components/schemas/RemoveStop"
                },
                {
                  "$ref": "#/components/schemas/UpsertReservation"
                },
                {
                  "$ref": "#/components/schemas/RemoveReservation"
                }
              ],
              "discriminator": {
                "propertyName": "op",
                "mapping": {
                  "ADD_STOP": "#/components/schemas/AddStop",
                  "CREATE_TRIP": "#/components/schemas/CreateTrip",
                  "MOVE_STOP": "#/components/schemas/MoveStop",
                  "REMOVE_RESERVATION": "#/components/schemas/RemoveReservation",
                  "REMOVE_STOP": "#/components/schemas/RemoveStop",
                  "UPDATE_TRIP": "#/components/schemas/UpdateTrip",
                  "UPSERT_RESERVATION": "#/components/schemas/UpsertReservation"
                }
              }
            },
            "type": "array",
            "maxItems": 50,
            "minItems": 1,
            "title": "Operations"
          },
          "inferred": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "maxItems": 20,
            "title": "Inferred"
          },
          "uncertainties": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "maxItems": 20,
            "title": "Uncertainties"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "grant_id",
          "expected_trip_version",
          "expected_plan_revision",
          "summary",
          "operations"
        ],
        "title": "Proposal"
      },
      "CreateTrip": {
        "properties": {
          "op": {
            "type": "string",
            "const": "CREATE_TRIP",
            "title": "Op"
          },
          "trip": {
            "$ref": "#/components/schemas/TripFields"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "op",
          "trip"
        ],
        "title": "CreateTrip"
      },
      "TripFields": {
        "properties": {
          "title": {
            "type": "string",
            "maxLength": 160,
            "minLength": 1,
            "title": "Title"
          },
          "start_date": {
            "type": "string",
            "format": "date",
            "title": "Start Date"
          },
          "end_date": {
            "type": "string",
            "format": "date",
            "title": "End Date"
          },
          "timezone": {
            "type": "string",
            "maxLength": 64,
            "minLength": 1,
            "title": "Timezone"
          },
          "status": {
            "type": "string",
            "enum": [
              "planned",
              "active",
              "completed",
              "cancelled"
            ],
            "title": "Status",
            "default": "planned"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "title",
          "start_date",
          "end_date",
          "timezone"
        ],
        "title": "TripFields"
      },
      "UpdateTrip": {
        "properties": {
          "op": {
            "type": "string",
            "const": "UPDATE_TRIP",
            "title": "Op"
          },
          "trip": {
            "$ref": "#/components/schemas/TripFields"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "op",
          "trip"
        ],
        "title": "UpdateTrip"
      },
      "AddStop": {
        "properties": {
          "op": {
            "type": "string",
            "const": "ADD_STOP",
            "title": "Op"
          },
          "stop": {
            "$ref": "#/components/schemas/Stop"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "op",
          "stop"
        ],
        "title": "AddStop"
      },
      "Stop": {
        "properties": {
          "id": {
            "type": "string",
            "maxLength": 80,
            "minLength": 1,
            "title": "Id"
          },
          "place_id": {
            "type": "string",
            "title": "Place Id"
          },
          "day": {
            "type": "string",
            "format": "date",
            "title": "Day"
          },
          "start": {
            "type": "string",
            "pattern": "^(?:[01]\\d|2[0-3]):[0-5]\\d$",
            "title": "Start",
            "default": "09:00"
          },
          "duration_minutes": {
            "type": "integer",
            "maximum": 1440.0,
            "minimum": 1.0,
            "title": "Duration Minutes",
            "default": 60
          },
          "travel_minutes": {
            "anyOf": [
              {
                "type": "integer",
                "maximum": 2880.0,
                "minimum": 0.0
              },
              {
                "type": "null"
              }
            ],
            "title": "Travel Minutes"
          },
          "mode": {
            "type": "string",
            "enum": [
              "walking",
              "transit",
              "driving",
              "bicycling"
            ],
            "title": "Mode",
            "default": "walking"
          },
          "anchor": {
            "type": "boolean",
            "title": "Anchor",
            "default": false
          },
          "note": {
            "type": "string",
            "maxLength": 2000,
            "title": "Note",
            "default": ""
          },
          "timezone": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 64
              },
              {
                "type": "null"
              }
            ],
            "title": "Timezone"
          },
          "fold": {
            "anyOf": [
              {
                "type": "integer",
                "enum": [
                  0,
                  1
                ]
              },
              {
                "type": "null"
              }
            ],
            "title": "Fold"
          },
          "reservation_refs": {
            "items": {
              "type": "string"
            },
            "type": "array",
            "maxItems": 20,
            "title": "Reservation Refs"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "id",
          "place_id",
          "day"
        ],
        "title": "Stop"
      },
      "MoveStop": {
        "properties": {
          "op": {
            "type": "string",
            "const": "MOVE_STOP",
            "title": "Op"
          },
          "stop_id": {
            "type": "string",
            "maxLength": 80,
            "minLength": 1,
            "title": "Stop Id"
          },
          "day": {
            "type": "string",
            "format": "date",
            "title": "Day"
          },
          "start": {
            "type": "string",
            "pattern": "^(?:[01]\\d|2[0-3]):[0-5]\\d$",
            "title": "Start"
          },
          "timezone": {
            "type": "string",
            "maxLength": 64,
