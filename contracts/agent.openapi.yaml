openapi: 3.1.0
info:
  title: Shadow Travel Agent API
  version: 0.1.0
servers:
  - url: https://travel.example.com
paths:
  /api/machine/v1/agent/nexus/commands:
    post:
      operationId: execute_nexus_travel_command
      summary: Apply one ordinary private Travel map, Trip, or reservation-note change
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Strict execution receipt for the committed Travel content
          content:
            application/json:
              schema: { type: object }
  /api/machine/v1/agent/summary:
    get:
      operationId: get_travel_agent_summary
      summary: Get a metadata-only Travel summary for granted resources
      responses:
        "200":
          description: Stable Nexus and App summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TravelSummary" }
  /api/machine/v1/agent/maps:
    get:
      operationId: list_agent_maps
      summary: List maps explicitly granted to the current Agent
      responses:
        "200":
          description: Authorized maps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMapList"
  /api/machine/v1/agent/maps/{map_id}:
    get:
      operationId: get_agent_map
      summary: Get minimal planning context for one granted map
      parameters:
        - $ref: "#/components/parameters/MapId"
      responses:
        "200":
          description: Minimal map context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMapContext"
  /api/machine/v1/agent/maps/{map_id}/drafts:
    post:
      operationId: create_agent_draft
      summary: Create a pending draft for one granted map
      parameters:
        - $ref: "#/components/parameters/MapId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentDraftCreate"
      responses:
        "201":
          description: Pending draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDraftCreated"
  /api/machine/v1/agent/nexus/reviews:
    get:
      operationId: list_nexus_travel_reviews
      responses:
        "200":
          description: Normalized Travel review queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NexusReviewList" }
    post:
      operationId: create_nexus_travel_review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NexusReviewCreate" }
      responses:
        "201":
          description: Normalized Travel review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NexusReview" }
  /api/machine/v1/agent/nexus/reviews/{review_id}/commit:
    post:
      operationId: commit_nexus_travel_review
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      responses:
        "200":
          description: Committed normalized Travel review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NexusReview" }
  /api/machine/v1/agent/nexus/reviews/{review_id}/reject:
    post:
      operationId: reject_nexus_travel_review
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      responses:
        "200":
          description: Rejected normalized Travel review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NexusReview" }
components:
  parameters:
    MapId:
      name: map_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ReviewId:
      name: review_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
  schemas:
    TravelSummary:
      type: object
      additionalProperties: false
      required: [protocol, domain, summary, observed_at, data_freshness, correlation_id]
      properties:
        protocol: { const: shadow.domain-summary.v1 }
        domain: { const: travel }
        summary:
          type: object
          additionalProperties: false
          required: [primary, detail, trips, maps, places, visits]
          properties:
            primary: { type: integer, minimum: 0 }
            detail: { type: string }
            trips: { type: integer, minimum: 0 }
            maps: { type: integer, minimum: 0 }
            places: { type: integer, minimum: 0 }
            visits: { type: integer, minimum: 0 }
        observed_at: { type: string, format: date-time }
        data_freshness:
          type: object
          additionalProperties: false
          required: [observed_at, missing_ratio]
          properties:
            observed_at: { type: string, format: date-time }
            missing_ratio: { type: number, minimum: 0, maximum: 1 }
        correlation_id: { type: string }
    NexusReviewCreate:
      type: object
      additionalProperties: false
      required: [intent, summary, fields]
      properties:
        intent: { type: string }
        summary: { type: string, maxLength: 500 }
        fields: { type: object, additionalProperties: true }
        source_text: { type: string, maxLength: 4000 }
        source_refs:
          type: array
          maxItems: 16
          items: { type: string }
    NexusReview:
      type: object
      additionalProperties: false
      required: [protocol, review_id, reference, revision, domain, intent, summary, fields, risk_level, state, created_at, source_refs, trace_id, receipt, replayed]
      properties:
        protocol: { const: shadow.review.v1 }
        review_id: { type: string }
        reference: { type: string }
        revision: { type: integer }
        domain: { const: travel }
        intent: { type: string }
        summary: { type: string }
        fields: { type: object, additionalProperties: true }
        risk_level: { const: L2 }
        state: { enum: [pending, committed, rejected] }
        created_at: { type: string, format: date-time }
        source_refs: { type: array, items: { type: string } }
        trace_id: { type: string }
        receipt:
          anyOf:
            - { type: string }
            - { type: "null" }
        replayed: { type: boolean }
    NexusReviewList:
      type: object
      additionalProperties: true
      required: [protocol, items, truncated, trace_id]
      properties:
        protocol: { const: shadow.review.v1 }
        items:
          type: array
          items: { $ref: "#/components/schemas/NexusReview" }
        truncated: { type: boolean }
        trace_id: { type: string }
    AgentMapSummary:
      type: object
      additionalProperties: false
      required: [id, title, city, country_code, updated_at, can_create_drafts]
      properties:
        id: { type: string }
        title: { type: string }
        city: { type: string }
        country_code: { type: string }
        updated_at: { type: string, format: date-time }
        can_create_drafts: { type: boolean }
    AgentMapList:
      type: object
      additionalProperties: false
      required: [maps]
      properties:
        maps:
          type: array
          items:
            $ref: "#/components/schemas/AgentMapSummary"
    AgentMap:
      type: object
      additionalProperties: false
      required: [id, title, subtitle, city, country_code, period]
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: string }
        city: { type: string }
        country_code: { type: string }
        period:
          anyOf:
            - { type: string }
            - { type: "null" }
    AgentPlace:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - address
        - district
        - city
        - category
        - tags
        - shared_note
        - custom_values
        - version
        - longitude
        - latitude
        - coordinate_reference
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        district: { type: string }
        city: { type: string }
        category: { type: string }
        tags:
          type: array
          items: { type: string }
        shared_note: { type: string }
        custom_values:
          type: object
          additionalProperties: true
        version: { type: integer }
        longitude: { type: number }
        latitude: { type: number }
        coordinate_reference: { type: string }
    AgentRoute:
      type: object
      additionalProperties: false
      required: [id, title, mode, stop_ids]
      properties:
        id: { type: string }
        title: { type: string }
        mode: { type: string }
        stop_ids:
          type: array
          items: { type: string }
    AgentMapContext:
      type: object
      additionalProperties: false
      required: [map, places, routes]
      properties:
        map:
          $ref: "#/components/schemas/AgentMap"
        places:
          type: array
          items:
            $ref: "#/components/schemas/AgentPlace"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/AgentRoute"
    AgentDraftCreate:
      type: object
      additionalProperties: false
      required: [draft_type, title, payload]
      properties:
        draft_type:
          enum: [route, place-list, map-notes]
        title:
          type: string
          minLength: 1
          maxLength: 160
        payload:
          type: object
          additionalProperties: true
    AgentDraftCreated:
      type: object
      additionalProperties: false
      required: [id, map_id, status, direct_domain_write]
      properties:
        id: { type: string }
        map_id: { type: string }
        status: { const: pending }
        direct_domain_write: { const: false }
