version: 2
app_id: travel
package_version: 0.1.1
skills:
  - id: travel-planning
    path: skills/travel-planning/SKILL.md
    summary: 读取授权地图与旅程，并按当前意图保存普通私人旅程及交通住宿摘要
    capabilities:
      - travel.maps.read
      - travel.drafts.create
      - travel.trips.read
      - travel.trips.propose
      - travel.reservations.read
      - travel.reservations.propose
    invocation:
      model: true
      user: true
capabilities:
  - id: travel.maps.read
    summary: 读取当前 Agent 已获资源授权的旅行地图及其最小化规划上下文
    audience: travel
    scopes: [travel.maps.read]
    tools:
      - name: travel.summary.get
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_travel_agent_summary
        exposure: hidden
        result_mode: summary
        max_result_bytes: 8192
        max_model_chars: 1200
        timeout_ms: 10000
        concurrency_safe: true
        retry_policy: idempotent
      - name: travel.maps.list
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: list_agent_maps
        exposure: on-demand
        result_mode: full
        max_result_bytes: 32768
        max_model_chars: 8000
        timeout_ms: 10000
        concurrency_safe: true
        retry_policy: idempotent
      - name: travel.maps.get
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_agent_map
        exposure: on-demand
        result_mode: full
        max_result_bytes: 131072
        max_model_chars: 24000
        timeout_ms: 15000
        concurrency_safe: true
        retry_policy: idempotent
    effect: read
    data_classification: personal
    risk_level: L0
    confirmation: none
    reversible: true
    resource_grant_required: true
    idempotency_required: false
  - id: travel.drafts.create
    summary: 在已授权地图中创建等待用户审核的结构化旅行草案
    audience: travel
    scopes: [travel.drafts.create]
    tools:
      - name: travel.drafts.create
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: create_agent_draft
        exposure: on-demand
        result_mode: full
        max_result_bytes: 4096
        max_model_chars: 1200
        timeout_ms: 15000
        concurrency_safe: false
        retry_policy: idempotent
      - name: travel.nexus.review.create
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: create_nexus_travel_review
        exposure: hidden
        result_mode: reference
        max_result_bytes: 16384
        max_model_chars: 1200
        timeout_ms: 15000
        concurrency_safe: false
        retry_policy: idempotent
    effect: draft
    data_classification: personal
    risk_level: L1
    confirmation: notify
    reversible: true
    resource_grant_required: true
    idempotency_required: true
  - id: travel.drafts.review
    summary: 按用户当前意图直接保存地图、旅程和交通住宿摘要，并保留版本化回执
    audience: travel
    scopes: [travel.drafts.review]
    tools:
      - name: travel.content.execute
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: execute_nexus_travel_command
        exposure: hidden
        result_mode: reference
        max_result_bytes: 16384
        max_model_chars: 1200
        timeout_ms: 15000
        concurrency_safe: false
        retry_policy: idempotent
      - name: travel.nexus.review.list
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: list_nexus_travel_reviews
        exposure: hidden
        result_mode: reference
        max_result_bytes: 262144
        max_model_chars: 1200
        timeout_ms: 15000
        concurrency_safe: true
        retry_policy: idempotent
      - name: travel.nexus.review.commit
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: commit_nexus_travel_review
        exposure: hidden
        result_mode: reference
        max_result_bytes: 16384
        max_model_chars: 1200
        timeout_ms: 15000
        concurrency_safe: false
        retry_policy: idempotent
      - name: travel.nexus.review.reject
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: reject_nexus_travel_review
        exposure: hidden
        result_mode: reference
        max_result_bytes: 16384
        max_model_chars: 1200
        timeout_ms: 15000
        concurrency_safe: false
        retry_policy: idempotent
    effect: write
    data_classification: personal
    risk_level: L2
    confirmation: policy
    reversible: true
    resource_grant_required: true
    idempotency_required: true
    execution:
      interaction: direct
      effect_scope: private
      reversibility: correctable
      result_kind: record
      authorization_mode: current_intent
      idempotency_window_seconds: 86400
  - id: travel.trips.read
    summary: 读取已明确授权的旅程与出发检查；不包含私人到访或照片
    audience: travel
    scopes: [travel.trips.read]
    tools:
      - name: travel.trips.summary
        transport: http
        contract_ref: contracts/agent-v2.openapi.yaml
        operation_id: get_agent_trip_summary
        exposure: hidden
        result_mode: summary
        max_result_bytes: 524288
        max_model_chars: 1600
        timeout_ms: 15000
        concurrency_safe: true
        retry_policy: idempotent
      - name: travel.trips.list
        transport: http
        contract_ref: contracts/agent-v2.openapi.yaml
        operation_id: list_agent_trips
        exposure: on-demand
        result_mode: full
        max_result_bytes: 524288
        max_model_chars: 16000
        timeout_ms: 15000
        concurrency_safe: true
        retry_policy: idempotent
      - name: travel.trips.get
        transport: http
        contract_ref: contracts/agent-v2.openapi.yaml
        operation_id: get_agent_trip
        exposure: on-demand
        result_mode: full
        max_result_bytes: 524288
        max_model_chars: 16000
        timeout_ms: 15000
        concurrency_safe: true
        retry_policy: idempotent
      - name: travel.trip.readiness.get
        transport: http
        contract_ref: contracts/agent-v2.openapi.yaml
        operation_id: get_agent_trip_readiness
        exposure: on-demand
        result_mode: full
        max_result_bytes: 524288
        max_model_chars: 16000
        timeout_ms: 15000
        concurrency_safe: true
        retry_policy: idempotent
    effect: read
    data_classification: personal
    risk_level: L0
    confirmation: none
    reversible: true
    resource_grant_required: true
    idempotency_required: false
  - id: travel.trips.propose
    summary: 提出待 Travel 登录用户逐次确认的 Trip 创建、更新与局部站次操作
    audience: travel
    scopes: [travel.trips.read, travel.trips.propose]
    tools:
      - name: travel.proposals.check
        transport: http
        contract_ref: contracts/agent-v2.openapi.yaml
        operation_id: check_agent_proposal
        exposure: on-demand
        result_mode: full
        max_result_bytes: 524288
        max_model_chars: 16000
        timeout_ms: 15000
        concurrency_safe: false
        retry_policy: idempotent
      - name: travel.proposals.create
        transport: http
        contract_ref: contracts/agent-v2.openapi.yaml
        operation_id: create_agent_proposal
        exposure: on-demand
        result_mode: full
        max_result_bytes: 524288
        max_model_chars: 16000
        timeout_ms: 15000
        concurrency_safe: false
        retry_policy: idempotent
      - name: travel.reviews.get
        transport: http
        contract_ref: contracts/agent-v2.openapi.yaml
        operation_id: get_agent_review
        exposure: on-demand
        result_mode: full
        max_result_bytes: 524288
        max_model_chars: 16000
        timeout_ms: 15000
        concurrency_safe: false
        retry_policy: idempotent
    effect: draft
    data_classification: personal
    risk_level: L1
    confirmation: notify
    reversible: true
    resource_grant_required: true
    idempotency_required: true
  - id: travel.reservations.read
    summary: 读取授权旅程的最小预订摘要，不返回附件地址
    audience: travel
    scopes: [travel.trips.read, travel.reservations.read]
    tools:
      - name: travel.reservations.list
        transport: http
        contract_ref: contracts/agent-v2.openapi.yaml
        operation_id: list_agent_reservations
        exposure: on-demand
        result_mode: full
        max_result_bytes: 524288
        max_model_chars: 16000
        timeout_ms: 15000
        concurrency_safe: true
        retry_policy: idempotent
    effect: read
    data_classification: personal
    risk_level: L0
    confirmation: none
    reversible: true
    resource_grant_required: true
    idempotency_required: false
  - id: travel.reservations.propose
    summary: 为已有旅程提出预订摘要变更，不付款、不出票、不保存未验证的跨服务引用
    audience: travel
    scopes: [travel.trips.read, travel.trips.propose, travel.reservations.read, travel.reservations.propose]
    tools:
      - name: travel.reservations.propose
        transport: http
        contract_ref: contracts/agent-v2.openapi.yaml
        operation_id: propose_agent_reservations
        exposure: on-demand
        result_mode: full
        max_result_bytes: 524288
        max_model_chars: 16000
        timeout_ms: 15000
        concurrency_safe: false
        retry_policy: idempotent
    effect: draft
    data_classification: personal
    risk_level: L1
    confirmation: notify
    reversible: true
    resource_grant_required: true
    idempotency_required: true
