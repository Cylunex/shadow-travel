version: 2
app_id: travel
package_version: 0.1.0
skills:
  - id: travel-planning
    path: skills/travel-planning/SKILL.md
    summary: 读取已授权旅行地图，并为用户创建可审核的路线、地点清单或地图备注草案
    capabilities:
      - travel.maps.read
      - travel.drafts.create
    invocation:
      model: true
      user: true
capabilities:
  - id: travel.maps.read
    summary: 读取当前 Agent 已获资源授权的旅行地图及其最小化规划上下文
    audience: travel
    scopes: [travel.maps.read]
    tools:
      - name: travel.maps.list
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: list_agent_maps
        exposure: on-demand
        result_mode: full
        max_result_bytes: 32768
        max_model_chars: 8000
        timeout_ms: 10000
        concurrency_safe: true
        retry_policy: idempotent
      - name: travel.maps.get
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: get_agent_map
        exposure: on-demand
        result_mode: full
        max_result_bytes: 131072
        max_model_chars: 24000
        timeout_ms: 15000
        concurrency_safe: true
        retry_policy: idempotent
    effect: read
    data_classification: personal
    risk_level: L0
    confirmation: none
    reversible: true
    resource_grant_required: true
    idempotency_required: false
  - id: travel.drafts.create
    summary: 在已授权地图中创建等待用户审核的结构化旅行草案
    audience: travel
    scopes: [travel.drafts.create]
    tools:
      - name: travel.drafts.create
        transport: http
        contract_ref: contracts/agent.openapi.yaml
        operation_id: create_agent_draft
        exposure: on-demand
        result_mode: full
        max_result_bytes: 4096
        max_model_chars: 1200
        timeout_ms: 15000
        concurrency_safe: false
        retry_policy: idempotent
    effect: draft
    data_classification: personal
    risk_level: L1
    confirmation: notify
    reversible: true
    resource_grant_required: true
    idempotency_required: true
