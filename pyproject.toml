[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shadow-travel"
version = "0.1.0"
description = "Map-first private travel planning and shared place collections"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "joserfc>=1.7,<2",
  "shadow-platform>=0.3,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["server/src/shadow_travel"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["server/src", "../shadow-platform"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["server/src", "server/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
